services:
  replay:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    mem_limit: 768m
    cpus: 0.65
    pids_limit: 512
    shm_size: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
